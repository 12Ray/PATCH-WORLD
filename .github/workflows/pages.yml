name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
      - run: |
          VERSION="$(git describe --tags --always --dirty)"
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=BUILD_SHA=${GITHUB_SHA::8} \
            --dart-define=BUILD_TIME=$(date -u +%Y%m%dT%H%M%SZ)
      - name: Enforce web release budgets
        shell: pwsh
        run: ./tool/qa_budget.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
